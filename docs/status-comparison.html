<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Today status comparison</title>
<style>body{font:16px system-ui;margin:24px;background:#f3f4f6;color:#1c2028}label{display:inline-block;margin:0 16px 16px 0}select{font:inherit;padding:8px}.pair{display:flex;gap:24px;flex-wrap:wrap}figure{margin:0;flex:1;min-width:280px;max-width:500px}img{display:block;width:100%;height:auto}figcaption{margin:8px 0;font-weight:600}</style>
<h1>Today: recorded status</h1><p>Fixed-time synthetic Today component captures on API36. App header/navigation are outside this fixture. No human comprehension or owner acceptance is implied. <a href="validation-status.md">Validation</a></p>
<label>Configuration <select id="config"><option>normal</option><option>320dp</option><option>font200</option><option>dark</option><option>rtl</option><option>expanded</option><option>small-dark-expanded</option><option>small-dark-rtl</option><option>saving</option><option>completed</option><option>partial</option></select></label><label>Recorded state <select id="state"><option>in</option><option>out</option></select></label><label><input id="scroll" type="checkbox"> Scrolled (expanded/200% configurations)</label>
<div class="pair"><figure><figcaption>Before — version 7</figcaption><img id="before" alt="Before refinement"></figure><figure><figcaption>After — original status vector</figcaption><img id="after" alt="After refinement"></figure></div>
<script>function update(){let c=document.querySelector('#config').value,s=document.querySelector('#state').value;let hasScroll=/font200|expanded|small-dark-rtl/.test(c);document.querySelector('#scroll').disabled=!hasScroll;let suffix=hasScroll&&document.querySelector('#scroll').checked?'-scrolled':'';for(let side of ['before','after'])document.getElementById(side).src=`screenshots/status/${side}/matrix/${c}-${s}${suffix}.png`;}document.querySelectorAll('select,input').forEach(e=>e.addEventListener('change',update));update();</script></html>
