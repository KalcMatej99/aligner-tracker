name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: https://github.com/actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        env:
          # Forgejo invokes /var/run/act through Ubuntu's /var/run -> /run link.
          # Preserve the entrypoint path for setup-java v6's ESM main guard.
          NODE_OPTIONS: --preserve-symlinks-main
        with:
          distribution: temurin
          java-version: '21'
      - uses: https://github.com/android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Verify CI runtime and isolation
        run: |
          test "$(uname -m)" = x86_64
          test ! -S /var/run/docker.sock
          test ! -e /var/lib/runner/.runner
          test "$JAVA_TOOL_OPTIONS" = '-XX:UseAVX=2'
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          node -e 'if (process.versions.node.split(".")[0] !== "24") process.exit(1)'
          java -XshowSettings:properties -version 2>&1 | grep 'java.specification.version = 21'
          mkdir -p app/build/reports/ci
          { uname -m; node --version; git --version; java -version; } > app/build/reports/ci/runtime.txt 2>&1
      - name: Format, test, lint and build
        run: ./scripts/check.sh
      - name: Require complete reports and APK
        run: |
          test -s app/build/reports/lint-results-debug.xml
          test -s app/build/reports/lint-results-debug.html
          test -s app/build/reports/tests/testDebugUnitTest/index.html
          find app/build/test-results/testDebugUnitTest -name 'TEST-*.xml' -print -quit | grep -q .
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload test and lint reports
        uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        if: always()
        with:
          name: android-reports
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/reports
            app/build/test-results/testDebugUnitTest/*.xml
      - name: Upload debug APK
        uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: android-debug-apk
          if-no-files-found: error
          retention-days: 14
          path: app/build/outputs/apk/debug/*.apk
