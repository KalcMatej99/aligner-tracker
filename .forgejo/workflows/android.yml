name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: https://github.com/android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Format, test, lint and build
        run: ./scripts/check.sh
      - name: Upload test and lint reports
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: android-reports
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/reports
            app/build/test-results/testDebugUnitTest/*.xml
      - name: Upload debug APK
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: android-debug-apk
          if-no-files-found: error
          retention-days: 14
          path: app/build/outputs/apk/debug/*.apk
